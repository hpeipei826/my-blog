<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Works — Pei's Blog ZZz</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Space Mono (適合這種 Lookbook 簡約風格) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Space Mono', monospace, sans-serif;
    }
    /* 隱藏預設捲動條，保持畫面乾淨 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#F5F5F3] text-black antialiased min-h-screen flex flex-col justify-between select-none">

  <!-- 1. 頂部頁首 Navbar -->
  <header class="w-full px-8 py-6 flex justify-between items-center text-xs tracking-wider uppercase font-bold">
    <div>
      <a href="index.html" class="hover:text-[#B91C1C] transition-colors">Pei's Blog ZZz</a>
    </div>
    <div class="text-gray-400">[Dreams Gallery]</div>
    <nav class="flex gap-6">
      <a href="#" class="hover:text-[#B91C1C] transition-colors">Articles</a>
      <a href="#" class="hover:text-[#B91C1C] transition-colors">Works</a>
      <a href="#" class="hover:text-[#B91C1C] transition-colors">About</a>
    </nav>
  </header>

  <!-- 2. 中央作品展覽滑動區塊 (Horizontal Interactive Gallery) -->
  <main class="my-auto py-12 w-full">
    <!-- 橫向滾動容器 -->
    <div class="flex items-center gap-6 px-12 md:px-24 overflow-x-auto no-scrollbar py-20">
      
      <!-- 卡片 1 (Hover 放大 + 上方顯示簡述) -->
      <a href="articles-1.html" class="group relative flex-shrink-0 w-28 sm:w-32 transition-all duration-500 ease-out hover:w-64 sm:hover:w-80">
        <!-- Hover 浮現的簡述文字 (定位於圖片上方) -->
        <div class="absolute -top-20 left-0 w-full opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none pb-4">
          <p class="text-[10px] text-gray-400 font-mono">[01] 巨災</p>
          <p class="text-xs font-normal uppercase tracking-tighter text-black leading-tight">
            SUN,2024/10/13
          </p>
        </div>
        
        <!-- 圖片本體 (Hover 變大與微幅亮起) -->
        <div class="w-full aspect-[3/4] overflow-hidden bg-gray-200 border border-gray-300 group-hover:shadow-2xl transition-all duration-500">
          <img 
            src="95420078.jpg" 
            alt="01" 
            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
          />
        </div>
      </a>

      <!-- 卡片 2 -->
      <a href="articles-2.html" class="group relative flex-shrink-0 w-28 sm:w-32 transition-all duration-500 ease-out hover:w-64 sm:hover:w-80">
        <div class="absolute -top-20 left-0 w-full opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none pb-4">
          <p class="text-[10px] text-gray-400 font-mono">[02] 自殺</p>
          <p class="text-xs font-normal uppercase tracking-tighter text-black leading-tight">
            THU,2025/10/23
          </p>
        </div>
        <div class="w-full aspect-[3/4] overflow-hidden bg-gray-200 border border-gray-300 group-hover:shadow-2xl transition-all duration-500">
          <img 
            src="95420036.jpg" 
            alt="Work 2" 
            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
          />
        </div>
      </a>

      <!-- 卡片 3 (預設焦點卡片展示效果) -->
      <a href="articles-3.html" class="group relative flex-shrink-0 w-28 sm:w-32 transition-all duration-500 ease-out hover:w-64 sm:hover:w-80">
        <div class="absolute -top-20 left-0 w-full opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none pb-4">
          <p class="text-[10px] text-gray-400 font-mono">[03] 絕症</p>
          <p class="text-xs font-normal uppercase tracking-tighter text-black leading-tight">
            SUN,2025/06/29
          </p>
        </div>
        <div class="w-full aspect-[3/4] overflow-hidden bg-gray-200 border border-gray-300 group-hover:shadow-2xl transition-all duration-500">
          <img 
            src="95420072.jpg" 
            alt="Work 3" 
            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
          />
        </div>
      </a>



    </div>
  </main>

  <!-- 3. Footer -->
  <footer class="w-full border-t border-black/10 px-6 md:px-12 py-6 flex justify-between items-center text-xs font-bold uppercase tracking-wider">
    <div class="text-gray-400">PEI's STUDIO</div>
    <div class="text-[#B91C1C]">© 2026 PEI'S BLOG. ALL RIGHTS RESERVED.</div>
  </footer>

</body>
</html>
