<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pei's Blog ZZz</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
  </style>
</head>
<body class="bg-white text-gray-900 antialiased min-h-screen flex flex-col justify-between">

  <!-- Main Container (12-Column Grid Boundary) -->
  <div class="max-w-7xl mx-auto px-6 sm:px-8 w-full flex-1 flex flex-col justify-between py-8 md:py-12">
    
    <!-- 1. Header / Navbar -->
    <header class="flex items-center justify-between w-full">
      <!-- Logo (貼齊第 1 欄左界) -->
      <a href="#" class="text-xl md:text-2xl font-bold text-[#B91C1C] tracking-tight hover:opacity-80 transition-opacity">
        Pei’s Blog ZZz
      </a>

      <!-- Nav Links (貼齊第 12 欄右界, Gap: 32px) -->
      <nav class="flex items-center space-x-8 text-base md:text-lg font-medium text-black">
        <a href="article.html" class="hover:text-red-700 transition-colors">articles</a>
        <a href="#" class="hover:text-red-700 transition-colors">Works</a>
        <a href="#" class="hover:text-red-700 transition-colors">About</a>
      </nav>
    </header>

 <!-- Hero 區塊 (左右雙欄佈局) -->
<main class="my-auto py-12 md:py-20">
  <div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-center">
    
    <!-- 左側文字 (佔 7 欄) -->
    <div class="md:col-span-7 flex flex-col items-start gap-6">
      <div class="space-y-3 md:space-y-4">
        <h1 class="text-5xl sm:text-6xl md:text-7xl font-extrabold text-black tracking-tight leading-none">
          Hi, I’m Pei !
        </h1>
        <p class="text-2xl sm:text-3xl md:text-4xl font-bold text-black tracking-tight leading-tight">
          Just a few of my random thoughts 
          written here.
        </p>
      </div>

      <a href="article.html" class="mt-2 inline-flex items-center justify-center px-6 py-3 bg-[#B91C1C] text-white text-base md:text-lg font-medium rounded-sm shadow-sm hover:bg-red-800 transition-colors duration-200">
        Click !
      </a>
    </div>

    <!-- 右側圖片 (佔 5 欄) -->
    <div class="md:col-span-5 w-full">
      <img 
        src="95420036.jpg" 
        alt="Pei" 
        class="w-full h-auto aspect-[4/5] object-cover rounded-md border border-gray-100 shadow-sm"
        loading="lazy"
      />
    </div>

  </div>
</main>

    <!-- 3. Footer -->
    <footer class="w-full pt-8">
      <p class="text-xs sm:text-sm text-[#B91C1C] font-normal">
        © 2026 Pei's Blog. All rights reserved.
      </p>
    </footer>

  </div>

</body>
</html>
